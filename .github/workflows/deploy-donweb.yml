name: Publicar en DonWeb

# Compila el sitio y sube la carpeta dist/ al hosting de DonWeb por FTP.
# Requiere estos secrets en GitHub (Settings > Secrets and variables > Actions):
#   FTP_SERVER      servidor FTP de DonWeb (ej: ftp.necapp.com.ar)
#   FTP_USERNAME    usuario FTP
#   FTP_PASSWORD    contraseña FTP
#   FTP_SERVER_DIR  carpeta de destino, con barra final (ej: public_html/)
# Mientras no existan, el workflow compila pero no publica.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Subir por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps

      - name: Aviso
        if: env.FTP_SERVER == ''
        run: echo "Faltan los secrets de FTP. El sitio compiló bien pero no se publicó."
